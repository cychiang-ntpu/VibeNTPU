# ============================================================
# VibeNTPU 網站自我檢核（GitHub Actions 自動檢核）
#
# 用途：每次 push 後，由 GitHub 提供的雲端虛擬機器下載課程的檢核腳本，
#       對 repo 根目錄的 index.html 進行靜態檢查，並將結果寫入執行頁面的 Summary。
#       這是持續整合（Continuous Integration, CI）的最小範例：
#       以自動化程式在每次變更後驗證品質，而不是依賴人工記得檢查。
#
# 安裝方式（只需一次）：
#   1. 開啟自己的 GitHub repo 首頁
#   2. 點選「Add file」→「Create new file」
#   3. 檔名輸入：.github/workflows/vibe-check.yml
#      （輸入 / 時 GitHub 會自動建立資料夾，屬正常現象）
#   4. 貼上本檔全部內容 → 點選「Commit changes」
#   5. 到 repo 上方的「Actions」分頁查看結果：
#      綠色勾號 = 必要項目全部通過；紅色叉號 = 尚有必要項目未通過，
#      點進該次執行即可在 Summary 看到各項 [通過]／[未通過] 與修改提示。
#
# 限制：此檢核只分析原始碼，無法確認 Netlify 部署或表單實際可用，仍須在瀏覽器實測。
# ============================================================

name: 網站自我檢核

# 觸發條件
on:
  push:               # 每次 push（包含 VS Code 的 Sync 與網頁上的 Commit changes）
  workflow_dispatch:  # 亦可在 Actions 分頁手動點選「Run workflow」

# 檢核範圍（Level）
#   1 = Level 1 部署基本要求（檢核點 3：形象首頁）
#   2 = Level 2 表單串接（檢核點 4：Netlify Forms 早鳥名單）
#   3 = Level 3 狀態保存（檢核點 5：LocalStorage 會員狀態與 AJAX 送出）
# 完成表單後將下方 "1" 改為 "2"；完成會員狀態保存後改為 "3"。
env:
  LEVEL: "1"

# 最小權限原則：只需讀取程式碼
permissions:
  contents: read

jobs:
  vibe-check:
    name: 檢核 index.html
    runs-on: ubuntu-latest   # 在 GitHub 提供的 Linux 虛擬機器上執行
    steps:
      # 步驟 1：將 repo 的檔案下載（checkout）到虛擬機器
      - name: 下載 repo 程式碼
        uses: actions/checkout@v4

      # 步驟 2：安裝 Python（檢核腳本以 Python 撰寫，僅使用標準函式庫）
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 步驟 3：從 VibeNTPU 課程 repo 下載最新版檢核腳本
      - name: 下載檢核腳本
        run: curl -fsSL -o vibe_check.py https://raw.githubusercontent.com/cychiang-ntpu/VibeNTPU/master/tools/ci/vibe_check.py

      # 步驟 4：將 Markdown 格式的檢核報告寫入 Summary（執行頁面上方的報告區）
      #         此步驟無論結果如何都不會失敗，只負責產生報告
      - name: 產生檢核報告（Summary）
        run: python3 vibe_check.py index.html --level "$LEVEL" --markdown >> "$GITHUB_STEP_SUMMARY" || true

      # 步驟 5：正式檢核。必要項目未通過時，腳本以結束代碼 1 結束，此步驟標示為失敗
      #         展開此步驟可看到每一項的 [通過]／[未通過] 標記與「請向 AI 說明」提示
      - name: 檢核 Level 1 至 Level ${{ env.LEVEL }}
        run: python3 vibe_check.py index.html --level "$LEVEL"
